name: Sunnah 24 — Enterprise CI/CD, GitHub Pages & Signed APK Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Root Web Files into www Directory
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-apk:
    name: Build, Verify & Release Sunnah 24 Signed APK
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RUN_NUMBER: ${{ github.run_number }}
      VERSION_NAME: "4.3.${{ github.run_number }}"

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js 22 & Java 17 (Android Gradle Toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Sync & Verify Web Assets
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js
          test -f www/manifest.json
          test -f www/sw.js
          test -f www/icon.svg
          test -f www/privacy.html
          node --check www/app.js
          node --check www/sw.js
          echo "✅ All Sunnah 24 assets and JS syntax verified!"

      - name: 4. Build Capacitor Android Bridge, Splash Screen & Direct Package Installer
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # 4A. Compute VERSION_CODE & update build.gradle so new APKs cleanly overwrite existing app
          VERSION_CODE=$((2200 + RUN_NUMBER))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/g" "$APP_GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" "$APP_GRADLE"
            echo "✅ Updated build.gradle to versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          fi

          # 4B. Convert www/icon.svg into All Android APK Mipmap Launcher Icons & Splash Previews
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          RES_DIR="android/app/src/main/res"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for folder in "${!SIZES[@]}"; do
            size=${SIZES[$folder]}
            mkdir -p "$RES_DIR/$folder"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_round.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_foreground.png"
          done

          # Generate Centered Splash Screen PNG from www/icon.svg for all Capacitor splash drawables
          rsvg-convert -w 512 -h 512 www/icon.svg -o /tmp/s24_logo_512.png
          convert -size 1080x1920 xc:"#05130E" /tmp/s24_logo_512.png -gravity center -composite /tmp/s24_splash_screen.png
          for existing_splash in $(find "$RES_DIR" -name "splash.png"); do
            cp -f /tmp/s24_splash_screen.png "$existing_splash"
          done

          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_foreground.xml"
          rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          echo "✅ Custom Sunnah 24 APK Launcher Icons & Splash Screens generated!"

          # 4C. Enable Android Auto-Backup AND Declare REQUEST_INSTALL_PACKAGES (Required so Package Installer doesn't abort on tap!)
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST_FILE" || true
            if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST_FILE"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' "$MANIFEST_FILE"
            fi
          fi

          # 4D. Inject FileProvider XML covering both Public Downloads and App External Storage
          XML_DIR="android/app/src/main/res/xml"
          mkdir -p "$XML_DIR"
          cat << 'EOF' > "$XML_DIR/file_paths.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="public_downloads" path="Download/" />
              <external-path name="external_root" path="." />
              <external-files-path name="external_files_path" path="." />
              <external-cache-path name="external_cache_path" path="." />
              <cache-path name="cache_path" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF

          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "fileprovider" "$MANIFEST_FILE"; then
              sed -i '/<\/application>/i \
              <provider\
                  android:name="androidx.core.content.FileProvider"\
                  android:authorities="${applicationId}.fileprovider"\
                  android:exported="false"\
                  android:grantUriPermissions="true">\
                  <meta-data\
                      android:name="android.support.FILE_PROVIDER_PATHS"\
                      android:resource="@xml/file_paths" />\
              </provider>' "$MANIFEST_FILE"
            fi
          fi

          # 4E. Inject Direct FileProvider Package Installer Bridge into MainActivity.java
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'JAVA_EOF' > "$MAIN_ACT"
          package com.mkrweb.sunnah24;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private long downloadId = -1;
              private File targetApkFile = null;
              private boolean installAlreadyTriggeredForCurrentDownload = false;
              private final Handler progressHandler = new Handler(Looper.getMainLooper());

              private final BroadcastReceiver onDownloadComplete = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                      if (downloadId != -1 && downloadId == id) {
                          progressHandler.removeCallbacksAndMessages(null);
                          notifyWebProgress(100, "✅ ডাউনলোড সম্পন্ন! ইনস্টলার চালু হচ্ছে...");
                          if (!installAlreadyTriggeredForCurrentDownload) {
                              installAlreadyTriggeredForCurrentDownload = true;
                              openApkWithSystemPackageInstaller(targetApkFile);
                          }
                      }
                  }
              };

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  if (downloadDir != null) {
                      if (!downloadDir.exists()) downloadDir.mkdirs();
                      targetApkFile = new File(downloadDir, "Sunnah24-Update.apk");
                  }

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      webView.setBackgroundColor(Color.parseColor("#05130E"));
                      WebSettings ws = webView.getSettings();
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      webView.addJavascriptInterface(new WebAppDownloader(), "AndroidDownloader");
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(onDownloadComplete, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED);
                  } else {
                      registerReceiver(onDownloadComplete, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "(window.handleSunnahBackNavigation ? window.handleSunnahBackNavigation() : false)",
                                  result -> {
                                      if ("false".equals(result)) {
                                          finish();
                                      }
                                  }
                              );
                          } else {
                              finish();
                          }
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  progressHandler.removeCallbacksAndMessages(null);
                  try {
                      unregisterReceiver(onDownloadComplete);
                  } catch (Exception ignored) {}
              }

              private File getVersionedApkFile(String versionTag) {
                  String safeTag = (versionTag == null || versionTag.isEmpty())
                      ? "latest"
                      : versionTag.replaceAll("[^a-zA-Z0-9._-]", "_");
                  File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  if (downloadDir != null && !downloadDir.exists()) downloadDir.mkdirs();
                  return new File(downloadDir, "Sunnah24-" + safeTag + ".apk");
              }

              private void notifyWebProgress(int pct, String message) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String safeMsg = message.replace("'", "\\'");
                          bridge.getWebView().evaluateJavascript(
                              "if(window.onSunnahApkDownloadProgress) window.onSunnahApkDownloadProgress(" + pct + ", '" + safeMsg + "');",
                              null
                          );
                      }
                  });
              }

              // Uses FileProvider +Explicit URI Read Grants so Android's Package Installer ALWAYS opens the APK!
              private void openApkWithSystemPackageInstaller(File apkFile) {
                  runOnUiThread(() -> {
                      try {
                          if (apkFile == null || !apkFile.exists()) {
                              Toast.makeText(MainActivity.this, "⚠️ APK ফাইলটি পাওয়া যায়নি।", Toast.LENGTH_LONG).show();
                              return;
                          }

                          Uri apkUri;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              apkUri = FileProvider.getUriForFile(
                                  MainActivity.this,
                                  getPackageName() + ".fileprovider",
                                  apkFile
                              );
                          } else {
                              apkUri = Uri.fromFile(apkFile);
                          }

                          Intent installIntent = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                          installIntent.setData(apkUri);
                          installIntent.putExtra(Intent.EXTRA_NOT_UNKNOWN_SOURCE, true);
                          installIntent.putExtra(Intent.EXTRA_INSTALLER_PACKAGE_NAME, getPackageName());
                          installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          installIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                          // Explicitly grant read permission to every package installer activity on the phone
                          List<ResolveInfo> resInfoList = getPackageManager().queryIntentActivities(
                              installIntent,
                              PackageManager.MATCH_DEFAULT_ONLY
                          );
                          for (ResolveInfo resolveInfo : resInfoList) {
                              String packageName = resolveInfo.activityInfo.packageName;
                              grantUriPermission(packageName, apkUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          }

                          startActivity(installIntent);
                      } catch (Exception primaryErr) {
                          // Fallback to standard ACTION_VIEW if OEM ROM customized ACTION_INSTALL_PACKAGE
                          try {
                              Uri apkUri = FileProvider.getUriForFile(
                                  MainActivity.this,
                                  getPackageName() + ".fileprovider",
                                  apkFile
                              );
                              Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                              viewIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                              viewIntent.putExtra(Intent.EXTRA_NOT_UNKNOWN_SOURCE, true);
                              viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              viewIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                              List<ResolveInfo> resInfoList = getPackageManager().queryIntentActivities(
                                  viewIntent,
                                  PackageManager.MATCH_DEFAULT_ONLY
                              );
                              for (ResolveInfo resolveInfo : resInfoList) {
                                  String packageName = resolveInfo.activityInfo.packageName;
                                  grantUriPermission(packageName, apkUri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              }

                              startActivity(viewIntent);
                          } catch (Exception fallbackErr) {
                              Toast.makeText(
                                  MainActivity.this,
                                  "Installer Error: " + fallbackErr.getMessage(),
                                  Toast.LENGTH_LONG
                              ).show();
                          }
                      }
                  });
              }

              public class WebAppDownloader {
                  @JavascriptInterface
                  public boolean isVersionApkCached(String versionTag) {
                      File f = getVersionedApkFile(versionTag);
                      if (f.exists() && f.length() > 1024 * 500) {
                          targetApkFile = f;
                          return true;
                      }
                      return false;
                  }

                  @JavascriptInterface
                  public void installCachedVersionApk(String versionTag) {
                      File f = getVersionedApkFile(versionTag);
                      if (f.exists() && f.length() > 1024 * 500) {
                          targetApkFile = f;
                          openApkWithSystemPackageInstaller(f);
                      } else if (targetApkFile != null && targetApkFile.exists()) {
                          openApkWithSystemPackageInstaller(targetApkFile);
                      } else {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "⚠️ APK ফাইলটি ডাউনলোড ফোল্ডারে পাওয়া যায়নি।", Toast.LENGTH_LONG).show());
                      }
                  }

                  @JavascriptInterface
                  public boolean isLocalApkCached() {
                      return targetApkFile != null && targetApkFile.exists() && targetApkFile.length() > 1024 * 500;
                  }

                  @JavascriptInterface
                  public void installLocalApk() {
                      if (targetApkFile != null && targetApkFile.exists()) {
                          openApkWithSystemPackageInstaller(targetApkFile);
                      }
                  }

                  @JavascriptInterface
                  public void downloadAndAutoInstallVersionApk(String urlString, String versionTag) {
                      targetApkFile = getVersionedApkFile(versionTag);
                      if (targetApkFile.exists() && targetApkFile.length() > 1024 * 500) {
                          notifyWebProgress(100, "✅ ফাইল ফোনে প্রস্তুত আছে! ইনস্টলার চালু হচ্ছে...");
                          openApkWithSystemPackageInstaller(targetApkFile);
                          return;
                      }
                      startNativeApkDownload(urlString, versionTag);
                  }

                  @JavascriptInterface
                  public void downloadAndInstallApk(String urlString) {
                      startNativeApkDownload(urlString, "latest");
                  }

                  private void startNativeApkDownload(String urlString, String versionTag) {
                      try {
                          installAlreadyTriggeredForCurrentDownload = false;
                          String safeTag = (versionTag == null || versionTag.isEmpty())
                              ? "latest"
                              : versionTag.replaceAll("[^a-zA-Z0-9._-]", "_");
                          String fileName = "Sunnah24-" + safeTag + ".apk";
                          targetApkFile = getVersionedApkFile(versionTag);
                          if (targetApkFile.exists()) {
                              targetApkFile.delete();
                          }

                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "⬇️ আপডেট ডাউনলোড শুরু হয়েছে...", Toast.LENGTH_SHORT).show());

                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(urlString));
                          request.setTitle("Sunnah 24 Update (" + safeTag + ")");
                          request.setDescription("Downloading official update package...");
                          request.setMimeType("application/vnd.android.package-archive");
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);

                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          downloadId = dm.enqueue(request);

                          progressHandler.removeCallbacksAndMessages(null);
                          progressHandler.post(new Runnable() {
                              @Override
                              public void run() {
                                  DownloadManager.Query q = new DownloadManager.Query();
                                  q.setFilterById(downloadId);
                                  try (Cursor c = dm.query(q)) {
                                      if (c != null && c.moveToFirst()) {
                                          int statusIdx = c.getColumnIndex(DownloadManager.COLUMN_STATUS);
                                          int bytesIdx = c.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR);
                                          int totalIdx = c.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES);
                                          int status = statusIdx >= 0 ? c.getInt(statusIdx) : -1;

                                          if (bytesIdx >= 0 && totalIdx >= 0) {
                                              long downloaded = c.getLong(bytesIdx);
                                              long total = c.getLong(totalIdx);
                                              if (total > 0) {
                                                  int pct = (int) ((downloaded * 100L) / total);
                                                  if (pct < 100) {
                                                      notifyWebProgress(pct, "⬇️ ডাউনলোড হচ্ছে (" + pct + "%)...");
                                                  }
                                              }
                                          }

                                          if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                              progressHandler.removeCallbacksAndMessages(null);
                                              notifyWebProgress(100, "✅ ডাউনলোড সম্পন্ন! ইনস্টলার স্ক্রিন চালু হচ্ছে...");
                                              if (!installAlreadyTriggeredForCurrentDownload) {
                                                  installAlreadyTriggeredForCurrentDownload = true;
                                                  openApkWithSystemPackageInstaller(targetApkFile);
                                              }
                                              return;
                                          } else if (status == DownloadManager.STATUS_FAILED) {
                                              progressHandler.removeCallbacksAndMessages(null);
                                              notifyWebProgress(-1, "❌ ডাউনলোড ব্যর্থ হয়েছে। পুনরায় চেষ্টা করুন।");
                                              return;
                                          }
                                      }
                                  } catch (Exception ignored) {}
                                  progressHandler.postDelayed(this, 350);
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download Error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }

                  @JavascriptInterface
                  public String getInstalledVersionName() {
                      try {
                          PackageInfo pInfo = getPackageManager().getPackageInfo(getPackageName(), 0);
                          return pInfo.versionName;
                      } catch (Exception e) {
                          return "4.3.0";
                      }
                  }

                  @JavascriptInterface
                  public boolean autoSaveInternalVault(String jsonPayload) {
                      try {
                          File vaultFile = new File(getFilesDir(), "sunnah24_enterprise_vault.json");
                          try (FileOutputStream fos = new FileOutputStream(vaultFile, false)) {
                              fos.write(jsonPayload.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String autoLoadInternalVault() {
                      try {
                          File vaultFile = new File(getFilesDir(), "sunnah24_enterprise_vault.json");
                          if (!vaultFile.exists()) return "";
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(new FileInputStream(vaultFile), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line);
                              }
                          }
                          return sb.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String saveJsonToDownloads(String fileName, String jsonContent) {
                      try {
                          String safeFileName = fileName.replaceAll("[^a-zA-Z0-9._-]", "_");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, safeFileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                                          os.flush();
                                      }
                                  }
                                  return "Downloads/" + safeFileName;
                              }
                          }
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (!dir.exists()) dir.mkdirs();
                          File outFile = new File(dir, safeFileName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return outFile.getAbsolutePath();
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }
              }
          }
          JAVA_EOF
            sed -i 's/^          //' "$MAIN_ACT"
            echo "✅ Injected Direct ACTION_INSTALL_PACKAGE + FileProvider Bridge into $MAIN_ACT"
          fi

      - name: 5. Compile Release APK & Play Store Bundle via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: 6. Sign Release APK with Original Persistent Keystore (V1 + V2 + V3 Schemes)
        run: |
          mkdir -p signing
          KEYSTORE_FILE="signing/sunnah24-release.keystore"
          KS_PASS="sunnah24pass"
          K_ALIAS="sunnah24"
          K_PASS="sunnah24pass"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          elif [ -f "sunnah24-release.keystore" ]; then
            cp -f "sunnah24-release.keystore" "$KEYSTORE_FILE"
            echo "✅ Using root sunnah24-release.keystore"
          elif [ -f "$KEYSTORE_FILE" ]; then
            echo "✅ Found existing persistent keystore in repository: $KEYSTORE_FILE"
          else
            echo "🔐 Generating permanent keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=MKRWeb, OU=Sunnah24, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_FILE"
            git commit -m "chore(signing): persist permanent Android release keystore [skip ci]" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="Sunnah-24-v4.3-Enterprise-Signed.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK"

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_FILE" -storepass "$KS_PASS" -keypass "$K_PASS" \
              "$AAB_PATH" "$K_ALIAS"
            cp "$AAB_PATH" ./Sunnah-24-v4.3-PlayStore-Signed.aab
          fi
          echo "✅ Signed APK ready: $SIGNED_APK (versionCode=${VERSION_CODE}, versionName=${VERSION_NAME})"

      - name: 7. Upload Signed APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Enterprise-APK
          path: |
            Sunnah-24-v4.3-Enterprise-Signed.apk
            Sunnah-24-v4.3-PlayStore-Signed.aab

      - name: 8. Publish Automatic GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "☪️ Sunnah 24 v${{ env.VERSION_NAME }} — Direct Package Installer Auto-Update APK"
          body: |
            ### ☪️ সুন্নাহ ২৪ (Sunnah 24) — Enterprise Signed Android APK Release (v${{ env.VERSION_NAME }})
            - **Direct Package Installer Launch:** Uses `ACTION_INSTALL_PACKAGE` + `FileProvider` with explicit `grantUriPermission` grants so the Android Package Installer opens the downloaded APK directly without failing in the chooser sheet.
            - **180-Day Triple-Redundant Auto-Vault:** Preserves all user habit records across LocalStorage, IndexedDB, and Native Android Vault during updates.
          files: |
            Sunnah-24-v4.3-Enterprise-Signed.apk
            Sunnah-24-v4.3-PlayStore-Signed.aab
