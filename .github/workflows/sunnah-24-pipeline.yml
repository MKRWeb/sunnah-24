name: Sunnah 24 — Enterprise CI/CD & Signed APK Release Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build, Verify & Release Sunnah 24 Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 & Java 17 (Android Gradle Toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Verify Web Assets & Cryptographic Integrity
        run: |
          echo "Verifying Sunnah 24 Enterprise Web Assets..."
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js
          test -f www/manifest.json
          test -f www/sw.js
          test -f www/icon.svg
          test -f www/privacy.html
          node --check www/app.js
          node --check www/sw.js
          echo "✅ All Sunnah 24 assets and JS syntax verified!"

      - name: 4. Build Capacitor Android Bridge & Inject Native Downloads Saver
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # Inject Native Android MediaStore Downloads Bridge into MainActivity.java
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.mkrweb.sunnah24;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new WebAppDownloader(), "AndroidDownloader");
                  }
              }

              public class WebAppDownloader {
                  @JavascriptInterface
                  public String saveJsonToDownloads(String filename, String jsonContent) {
                      try {
                          byte[] bytes = jsonContent.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Sunnah24");
                              ContentResolver resolver = getContentResolver();
                              Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                      }
                                  }
                                  runOnUiThread(() -> Toast.makeText(
                                      MainActivity.this,
                                      "✅ Saved: Downloads/Sunnah24/" + filename,
                                      Toast.LENGTH_LONG
                                  ).show());
                                  return "Downloads/Sunnah24/" + filename;
                              }
                          } else {
                              File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Sunnah24");
                              if (!dir.exists()) dir.mkdirs();
                              File file = new File(dir, filename);
                              try (FileOutputStream fos = new FileOutputStream(file)) {
                                  fos.write(bytes);
                                  fos.flush();
                              }
                              runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  "✅ Saved: Downloads/Sunnah24/" + filename,
                                  Toast.LENGTH_LONG
                              ).show());
                              return file.getAbsolutePath();
                          }
                      } catch (Exception e) {
                          try {
                              File fallbackDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                              if (fallbackDir != null && !fallbackDir.exists()) fallbackDir.mkdirs();
                              File fallbackFile = new File(fallbackDir, filename);
                              try (FileOutputStream fos = new FileOutputStream(fallbackFile)) {
                                  fos.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                                  fos.flush();
                              }
                              return fallbackFile.getAbsolutePath();
                          } catch (Exception ex) {
                              return "ERROR:" + ex.getMessage();
                          }
                      }
                      return "ERROR:Unknown";
                  }
              }
          }
          EOF
            echo "✅ Injected Native AndroidDownloader bridge into $MAIN_ACT"
          fi

      - name: 5. Compile Release & Debug APKs via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: 6. Sign Release APK for Direct Installation & Distribution
        run: |
          keytool -genkey -v -keystore sunnah24-release.keystore \
            -alias sunnah24 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sunnah24pass -keypass sunnah24pass \
            -dname "CN=MKRWeb, OU=Sunnah24, O=MKRWeb, L=Dhaka, S=Dhaka, C=BD"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="Sunnah-24-v2.8-Enterprise-Signed.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks sunnah24-release.keystore \
            --ks-key-alias sunnah24 --ks-pass pass:sunnah24pass \
            --key-pass pass:sunnah24pass --out "$SIGNED_APK" app-release-aligned.apk
          echo "✅ Signed APK ready: $SIGNED_APK"

      - name: 7. Upload Signed APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Enterprise-APK
          path: |
            Sunnah-24-v2.8-Enterprise-Signed.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: 8. Publish Automatic GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.${{ github.run_number }}
          name: "☪️ Sunnah 24 v2.8.${{ github.run_number }} — Enterprise Prophetic Lifestyle APK"
          body: |
            ### ☪️ সুন্নাহ ২৪ (Sunnah 24) — Enterprise Signed Android APK Release
            - **Default Language:** বাংলা (Bangla) + العربية (Arabic) + English
            - **Direct Device Backup:** Saves signed JSON directly to `Downloads/Sunnah24/` on Android
            - **32 Authentic 24-Hour Prophetic Habits** & **12 Full Masnoon Duas**
            - **100% Offline & SHA-256 Tamper-Proof Cryptographic Ledger**
          files: |
            Sunnah-24-v2.8-Enterprise-Signed.apk
