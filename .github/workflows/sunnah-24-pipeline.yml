name: Sunnah 24 — Dynamic Auto-Versioning Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Web Files into www Directory
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done
          if [ ! -f "www/privacy.html" ]; then
            echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Privacy Policy - Sunnah 24</title></head><body style='background:#05130e;color:#f8fafc;font-family:sans-serif;padding:24px;'><h1>Sunnah 24 Privacy Policy</h1><p>Sunnah 24 operates 100% offline.</p></body></html>" > www/privacy.html
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Web Files into www Directory for Capacitor
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Generate Native Android Project
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Compile Release APK & Google Play App Bundle (AAB)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Cloud Keystore Setup & Cryptographic Signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            KS_PASS="Sunnah24SecurePass"
            K_ALIAS="sunnah24"
            K_PASS="Sunnah24SecurePass"
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$K_ALIAS" \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=MKRWeb, OU=Mobile, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"
          fi

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-key.jks \
            -storepass "$KS_PASS" \
            -keypass "$K_PASS" \
            "$AAB_PATH" "$K_ALIAS"

          cp "$AAB_PATH" ./Sunnah-24-PlayStore-Signed.aab

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" aligned-release.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out ./Sunnah-24-Release-Signed.apk \
            aligned-release.apk

          rm -f aligned-release.apk

      - name: Generate Dynamic Version Tag
        id: dynamic_version
        run: |
          # Generates format like v2.6.20261024.1430 (YearMonthDay.HourMinute)
          DATE_TAG="v2.6.$(date -u +'%Y%m%d.%H%M')"
          echo "tag_name=$DATE_TAG" >> $GITHUB_OUTPUT
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$DATE_TAG"
          git push origin "$DATE_TAG"

      - name: Publish Fresh Signed APK & Play Store AAB to GitHub Releases Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dynamic_version.outputs.tag_name }}
          name: "Sunnah 24 — Automated Build (${{ steps.dynamic_version.outputs.tag_name }})"
          body: |
            ### ☪️ Sunnah 24 — Corporate Production Build
            *Version: `${{ steps.dynamic_version.outputs.tag_name }}` — Updated automatically on code push.*
            
            - **📱 Direct Android APK Download:** [**⬇️ Tap Here to Download `Sunnah-24-Release-Signed.apk`**](https://github.com/${{ github.repository }}/releases/download/${{ steps.dynamic_version.outputs.tag_name }}/Sunnah-24-Release-Signed.apk)
            - **🏪 Google Play Console Bundle:** [**⬇️ Tap Here to Download `Sunnah-24-PlayStore-Signed.aab`**](https://github.com/${{ github.repository }}/releases/download/${{ steps.dynamic_version.outputs.tag_name }}/Sunnah-24-PlayStore-Signed.aab)
            - **🌐 Live Web PWA:** https://mkrweb.github.io/sunnah-24/
          files: |
            Sunnah-24-Release-Signed.apk
            Sunnah-24-PlayStore-Signed.aab
          generate_release_notes: true

      - name: Upload Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Signed-Production-Binaries
          path: |
            Sunnah-24-Release-Signed.apk
            Sunnah-24-PlayStore-Signed.aab
