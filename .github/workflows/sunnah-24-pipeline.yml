name: Sunnah 24 — Foolproof Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Web Files into www Directory
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done
          if [ ! -f "www/privacy.html" ]; then
            echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Privacy Policy - Sunnah 24</title></head><body style='background:#05130e;color:#f8fafc;font-family:sans-serif;padding:24px;'><h1>Sunnah 24 Privacy Policy</h1><p>Sunnah 24 operates 100% offline.</p></body></html>" > www/privacy.html
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Web Files into www Directory for Capacitor
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Generate Native Android Project
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Generate Native Android Launcher Icons & Adaptive Vectors
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          # 1. Prepare 1024x1024 Master Assets for @capacitor/assets
          mkdir -p assets
          cp www/icon.svg assets/icon-only.svg
          cp www/icon.svg assets/icon-foreground.svg
          rsvg-convert -w 1024 -h 1024 www/icon.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 www/icon.svg -o assets/icon-foreground.png
          rsvg-convert -w 2732 -h 2732 www/icon.svg -o assets/splash.png
          rsvg-convert -w 2732 -h 2732 www/icon.svg -o assets/splash-dark.png

          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#064e3b' --iconBackgroundColorDark '#05130e' --splashBackgroundColor '#05130e' --splashBackgroundColorDark '#05130e' || true

          # 2. Directly Rasterize Exact PNG Mipmaps Across All Android Screen Densities
          RES_DIR="android/app/src/main/res"
          declare -A DENSITIES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
          declare -A FG_DENSITIES=( ["mdpi"]=108 ["hdpi"]=162 ["xhdpi"]=216 ["xxhdpi"]=324 ["xxxhdpi"]=432 )

          for density in "${!DENSITIES[@]}"; do
            SIZE=${DENSITIES[$density]}
            FG_SIZE=${FG_DENSITIES[$density]}
            TARGET_DIR="$RES_DIR/mipmap-$density"
            mkdir -p "$TARGET_DIR"
            rsvg-convert -w "$SIZE" -h "$SIZE" www/icon.svg -o "$TARGET_DIR/ic_launcher.png"
            rsvg-convert -w "$SIZE" -h "$SIZE" www/icon.svg -o "$TARGET_DIR/ic_launcher_round.png"
            rsvg-convert -w "$FG_SIZE" -h "$FG_SIZE" www/icon.svg -o "$TARGET_DIR/ic_launcher_foreground.png"
          done

          # 3. Inject Native Android Adaptive Vector Drawables (Android 8.0 to Android 15+)
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/drawable-v24" "$RES_DIR/values"

          cat << 'EOF' > "$RES_DIR/values/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#064E3B</color>
          </resources>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#064E3B"
                  android:pathData="M0,0h512v512h-512z" />
          </vector>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_foreground.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <group
                  android:scaleX="0.62"
                  android:scaleY="0.62"
                  android:translateX="97.28"
                  android:translateY="97.28">
                  <path
                      android:fillColor="#00000000"
                      android:strokeColor="#EAB308"
                      android:strokeWidth="14"
                      android:pathData="M256,64 A192,192 0 1,1 255.9,64 Z" />
                  <path
                      android:fillColor="#EAB308"
                      android:pathData="M295,140 A95,95 0 1,0 365,290 A80,80 0 1,1 295,140 Z" />
              </group>
          </vector>
          EOF

          cp -f "$RES_DIR/drawable/ic_launcher_foreground.xml" "$RES_DIR/drawable-v24/ic_launcher_foreground.xml" || true

      - name: Compile Release APK & Google Play App Bundle (AAB)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Cloud Keystore Setup & Cryptographic Signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            KS_PASS="Sunnah24SecurePass"
            K_ALIAS="sunnah24"
            K_PASS="Sunnah24SecurePass"
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$K_ALIAS" \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=MKRWeb, OU=Mobile, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"
          fi

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-key.jks \
            -storepass "$KS_PASS" \
            -keypass "$K_PASS" \
            "$AAB_PATH" "$K_ALIAS"

          cp "$AAB_PATH" ./Sunnah-24-PlayStore-Signed.aab

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" aligned-release.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out ./Sunnah-24-Release-Signed.apk \
            aligned-release.apk

          rm -f aligned-release.apk
          ls -lh ./Sunnah-24-Release-Signed.apk ./Sunnah-24-PlayStore-Signed.aab

      - name: Generate Dynamic Version Tag Only After Successful Build
        id: dynamic_version
        run: |
          DATE_TAG="v2.7.$(date -u +'%Y%m%d.%H%M%S')"
          echo "tag_name=$DATE_TAG" >> $GITHUB_OUTPUT
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$DATE_TAG"
          git push origin "$DATE_TAG"

      - name: Publish Verified Signed APK & AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dynamic_version.outputs.tag_name }}
          name: "Sunnah 24 — Verified Build (${{ steps.dynamic_version.outputs.tag_name }})"
          body: |
            ### ☪️ Sunnah 24 — Corporate Production Build (With Native Launcher Icon)
            - **📱 Direct Android APK Download:** [**⬇️ Tap Here to Download `Sunnah-24-Release-Signed.apk`**](https://github.com/${{ github.repository }}/releases/download/${{ steps.dynamic_version.outputs.tag_name }}/Sunnah-24-Release-Signed.apk)
            - **🏪 Google Play Console Bundle:** [**⬇️ Tap Here to Download `Sunnah-24-PlayStore-Signed.aab`**](https://github.com/${{ github.repository }}/releases/download/${{ steps.dynamic_version.outputs.tag_name }}/Sunnah-24-PlayStore-Signed.aab)
            - **🌐 Live Web PWA:** https://mkrweb.github.io/sunnah-24/
          files: |
            Sunnah-24-Release-Signed.apk
            Sunnah-24-PlayStore-Signed.aab
          generate_release_notes: true

      - name: Upload Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Signed-Production-Binaries
          path: |
            Sunnah-24-Release-Signed.apk
            Sunnah-24-PlayStore-Signed.aab
