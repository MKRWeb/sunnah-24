name: Sunnah 24 — Enterprise CI/CD, GitHub Pages, Signed APK & Play Store AAB Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'signing/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_repositories:
        description: 'Optional comma/space-separated mirror repositories for gradual multi-repo auto-update (e.g. MKRWeb/sunnah-24-mirror)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Unified workflow-level concurrency group:
# Rapid multi-file edits (www/index.html, www/style.css, www/app.js, or future modules) cancel intermediate runs
# so only the final combined state deploys to GitHub Pages and compiles into APK/AAB.
concurrency:
  group: "sunnah24-atomic-pipeline-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: 1. Atomic Web Verification, Gradual Multi-Repo Sync & GitHub Pages Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Batch Stabilization Buffer & Enforce Single-Pipeline Rule (Only 2 Jobs Total)
        run: |
          echo "⏳ Waiting 8s to allow rapid multi-file commits inside www/ to coalesce..."
          sleep 8

      - name: 2. Checkout Repository & Pull Latest Branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 3. Setup Node.js 24 for JS Syntax Verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. Enforce Clean Root (Keep Web Assets Strictly Inside www/ Only) & Auto Cache-Busting
        run: |
          # Ensure we are on the absolute latest commit of the branch after the stabilization buffer
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          mkdir -p www
          REPO_CLEANUP_NEEDED=0

          # 4A. Remove any redundant workflow files besides sunnah-24-pipeline.yml
          if [ -d ".github/workflows" ]; then
            for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
              if [ -f "$wf" ] && [ "$(basename "$wf")" != "sunnah-24-pipeline.yml" ]; then
                echo "🧹 Removing redundant workflow file: $wf"
                git rm -f "$wf" || rm -f "$wf"
                REPO_CLEANUP_NEEDED=1
              fi
            done
          fi

          # 4B. Remove legacy monolithic app.js if modular files exist, and keep active web assets strictly inside www/
          if [ -f "www/ui.js" ] && [ -f "www/storage.js" ] && [ -f "www/astronomy.js" ]; then
            for legacy_js in app.js www/app.js; do
              if [ -f "$legacy_js" ]; then
                echo "🗑️ Removing obsolete monolithic $legacy_js (replaced by modular v4.3 scripts)"
                git rm -f "$legacy_js" 2>/dev/null || rm -f "$legacy_js"
                REPO_CLEANUP_NEEDED=1
              fi
            done
          fi

          # Consolidate any stray root web assets into www/ and DELETE them from the main root directory
          WEB_ASSETS="index.html style.css sw.js manifest.json icon.svg privacy.html version.json"
          for extra in *.html *.css *.js *.svg *.png *.webp *.ico *.woff2; do
            if [ -f "$extra" ] && [ "$extra" != "package.json" ] && [ "$extra" != "package-lock.json" ] && [ "$extra" != "capacitor.config.json" ]; then
              case " $WEB_ASSETS " in
                *" $extra "*) ;;
                *) WEB_ASSETS="$WEB_ASSETS $extra" ;;
              esac
            fi
          done

          for f in $WEB_ASSETS; do
            if [ -f "$f" ]; then
              if [ ! -f "www/$f" ]; then
                echo "📦 Moving root $f -> www/$f"
                cp -f "$f" "www/$f"
              else
                ROOT_TS=$(git log -1 --format="%ct" -- "$f" 2>/dev/null || echo 0)
                WWW_TS=$(git log -1 --format="%ct" -- "www/$f" 2>/dev/null || echo 0)
                if [ "${ROOT_TS:-0}" -gt "${WWW_TS:-0}" ]; then
                  echo "🔄 Root $f had newer edit; copying to www/$f before cleaning root"
                  cp -f "$f" "www/$f"
                fi
              fi
              echo "🗑️ Removing duplicate $f from main root directory (keeping only www/$f)"
              git rm -f "$f" 2>/dev/null || rm -f "$f"
              REPO_CLEANUP_NEEDED=1
            fi
          done

          # Also remove any generated www/version.json from git tracking if present (generated at build time only)
          if git ls-files --error-unmatch www/version.json >/dev/null 2>&1; then
            git rm -f www/version.json || true
            REPO_CLEANUP_NEEDED=1
          fi

          if [ "$REPO_CLEANUP_NEEDED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add www/ 2>/dev/null || true
            git commit -m "chore(clean-root): keep web assets strictly inside www/ only [skip ci]" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

          LATEST_SHA=$(git rev-parse --short=7 HEAD)

          # 4C. Stamp Service Worker cache version & HTML asset query strings inside www/ (for artifact deployment only, not committed back)
          CACHE_VER="v4.3.${GITHUB_RUN_NUMBER}-${LATEST_SHA}"
          if [ -f "www/sw.js" ]; then
            sed -i "s/sunnah-24-cache-[a-zA-Z0-9._-]*/sunnah-24-cache-${CACHE_VER}/g" www/sw.js || true
            sed -i "s/CACHE_NAME = ['\"][^'\"]*['\"]/CACHE_NAME = 'sunnah-24-cache-${CACHE_VER}'/g" www/sw.js || true
          fi
          if [ -f "www/index.html" ]; then
            sed -i "s|href=\"style.css[^\"]*\"|href=\"style.css?v=${CACHE_VER}\"|g" www/index.html || true
            for mod in data/i18n-data.js data/habits-duas-data.js data/locations-data.js storage.js astronomy.js ui.js; do
              sed -i "s|src=\"${mod}[^\"]*\"|src=\"${mod}?v=${CACHE_VER}\"|g" www/index.html || true
            done
          fi

          # Verify syntax of all modular JavaScript files in www/ and www/data/
          find www -name "*.js" -exec node --check {} +
          echo "✅ Clean www/-only Web Bundle verified with cache version: ${CACHE_VER}"

      - name: 5. Gradual Multi-Repository Auto-Update & Pages Rollout (Wave-by-Wave Sync)
        env:
          SYNC_PAT: ${{ secrets.MULTI_REPO_PAT || secrets.RELEASE_PAT || secrets.GH_PAT || '' }}
          REPOS_FROM_VARS: ${{ vars.TARGET_REPOSITORIES || secrets.TARGET_REPOSITORIES || '' }}
          REPOS_FROM_INPUT: ${{ github.event.inputs.target_repositories || '' }}
        run: |
          RAW_REPOS="${REPOS_FROM_INPUT} ${REPOS_FROM_VARS}"
          if [ -f "sync-repos.txt" ]; then
            FILE_REPOS=$(grep -v '^[[:space:]]*#' sync-repos.txt | tr '\n' ' ')
            RAW_REPOS="${RAW_REPOS} ${FILE_REPOS}"
          fi
          CLEAN_REPOS=$(echo "$RAW_REPOS" | tr ',' ' ' | xargs)

          if [ -z "$CLEAN_REPOS" ]; then
            echo "ℹ️ Single-repository mode active (${GITHUB_REPOSITORY})."
            exit 0
          fi

          if [ -z "$SYNC_PAT" ]; then
            echo "⚠️ Target repositories specified ($CLEAN_REPOS), but MULTI_REPO_PAT / GH_PAT secret is not set. Skipping external repo push."
            exit 0
          fi

          WAVE_INDEX=0
          for TARGET_REPO in $CLEAN_REPOS; do
            if [ "$TARGET_REPO" = "${GITHUB_REPOSITORY}" ]; then
              continue
            fi
            WAVE_INDEX=$((WAVE_INDEX + 1))
            echo "🌊 [Gradual Wave #${WAVE_INDEX}] Auto-updating repository: ${TARGET_REPO} ..."

            TMP_DIR="/tmp/s24-mirror-${WAVE_INDEX}"
            rm -rf "$TMP_DIR"
            if git clone --depth 1 "https://x-access-token:${SYNC_PAT}@github.com/${TARGET_REPO}.git" "$TMP_DIR" 2>/dev/null || git clone "https://x-access-token:${SYNC_PAT}@github.com/${TARGET_REPO}.git" "$TMP_DIR"; then
              rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='android/build' --exclude='android/app/build' ./ "$TMP_DIR/"
              (
                cd "$TMP_DIR"
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git checkout -- www/sw.js www/index.html 2>/dev/null || true
                git add -A
                if [ -n "$(git status --porcelain)" ]; then
                  git commit -m "chore(multi-repo-sync): gradual auto-update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
                  TARGET_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "main")
                  git push origin "HEAD:${TARGET_BRANCH}"
                  echo "✅ Successfully synced & triggered Pages deployment on ${TARGET_REPO} (${TARGET_BRANCH})"
                else
                  echo "⚡ ${TARGET_REPO} is already up to date."
                fi
              )
              sleep 5
            else
              echo "⚠️ Could not clone ${TARGET_REPO}. Verify repository name and PAT permissions."
            fi
          done

      - name: 6. Persist Verified www/ Bundle for Android APK/AAB Job
        uses: actions/upload-artifact@v4
        with:
          name: sunnah24-verified-www-bundle
          path: ./www
          if-no-files-found: error

      - name: 7. Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 8. Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v4
        with:
          path: './www'

      - name: 9. Deploy to GitHub Pages (Attempt 1)
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
        continue-on-error: true

      - name: 9B. Wait Briefly Before Pages Deployment Retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "⏳ GitHub Pages artifact metadata briefly delayed; waiting 8s before retry..."
          sleep 8

      - name: 9C. Deploy to GitHub Pages (Retry After Metadata Sync)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        timeout-minutes: 10

  build-and-release-apk:
    name: 2. Build, Verify & Release Signed APK & Play Store Ready AAB
    needs: deploy-pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RUN_NUMBER: ${{ github.run_number }}
      VERSION_NAME: "4.3.${{ github.run_number }}"

    steps:
      - name: 1. Checkout Repository & Pull Latest Branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 2. Setup Node.js 24, Java 21 & Persistent Gradle Dependency Cache (API 36)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 2B. Cache Gradle Dependencies & Wrapper to Prevent Maven 429 Rate Limits
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-sunnah24-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-sunnah24-

      - name: 3. Download Verified www/ Web Bundle from Job 1
        uses: actions/download-artifact@v4
        with:
          name: sunnah24-verified-www-bundle
          path: ./www

      - name: 4. Verify Web Assets inside www/ for APK/AAB Bundle
        run: |
          # Normalize nested www/www/ if present from artifact extraction
          if [ ! -f "www/index.html" ] && [ -d "www/www" ]; then
            cp -rf www/www/* www/ 2>/dev/null || true
            rm -rf www/www
          fi
          # Fallback to git checkout of www/ if still missing
          if [ ! -f "www/index.html" ]; then
            git checkout HEAD -- www 2>/dev/null || true
          fi

          REQUIRED_FILES="
            www/index.html
            www/style.css
            www/data/i18n-data.js
            www/data/habits-duas-data.js
            www/data/locations-data.js
            www/storage.js
            www/astronomy.js
            www/ui.js
            www/manifest.json
            www/sw.js
            www/icon.svg
            www/privacy.html
          "
          MISSING=0
          for rf in $REQUIRED_FILES; do
            if [ ! -f "$rf" ]; then
              echo "❌ Missing required asset: $rf"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "📂 Current www directory contents:"
            ls -laR www || true
            exit 1
          fi

          # Normalize asset URLs inside www/index.html for offline Android Capacitor WebView (strip ?v=... query strings that break offline SW/asset matching)
          sed -i -E 's|(href="style\.css)\?v=[^"]*"|\1"|g' www/index.html || true
          for mod in data/i18n-data.js data/habits-duas-data.js data/locations-data.js storage.js astronomy.js ui.js; do
            sed -i -E "s|(src=\"${mod})\?v=[^\"]*\"|\1\"|g" www/index.html || true
          done

          find www -name "*.js" -exec node --check {} +
          echo "✅ All Sunnah 24 assets and JS syntax verified for Android packaging!"

      - name: 5. Prepare Release Keystore (Encrypted Secrets First + Safe Existing Repo Keystore Fallback)
        run: |
          mkdir -p signing
          KEYSTORE_FILE="$PWD/signing/sunnah24-release.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "❌ SECURITY ERROR: KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD is missing."
              exit 1
            fi
            # Strip any accidental whitespace/newlines from pasted Base64 secret before decoding
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            if [ ! -s "$KEYSTORE_FILE" ]; then
              echo "❌ SECURITY ERROR: Decoded KEYSTORE_BASE64 is empty or invalid Base64."
              exit 1
            fi
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
            echo "✅ Decoded release keystore from encrypted GitHub Secrets."
          elif [ -f "sunnah24-release.keystore" ]; then
            cp -f "sunnah24-release.keystore" "$KEYSTORE_FILE"
            KS_PASS="${KEYSTORE_PASSWORD:-sunnah24pass}"
            K_ALIAS="${KEY_ALIAS:-sunnah24}"
            K_PASS="${KEY_PASSWORD:-sunnah24pass}"
            echo "ℹ️ Using existing repository root sunnah24-release.keystore (tip: migrate to GitHub Secrets KEYSTORE_BASE64)."
          elif [ -f "$KEYSTORE_FILE" ]; then
            KS_PASS="${KEYSTORE_PASSWORD:-sunnah24pass}"
            K_ALIAS="${KEY_ALIAS:-sunnah24}"
            K_PASS="${KEY_PASSWORD:-sunnah24pass}"
            echo "ℹ️ Using existing signing/sunnah24-release.keystore."
          else
            echo "❌ SECURITY ERROR: No release keystore found in KEYSTORE_BASE64 secret or repository."
            echo "💡 Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Verify keystore integrity, alias, and store password before Gradle build starts
          keytool -list -keystore "$KEYSTORE_FILE" -alias "$K_ALIAS" -storepass "$KS_PASS" >/dev/null
          echo "✅ Verified release keystore integrity and alias '${K_ALIAS}'."

          echo "KEYSTORE_FILE=${KEYSTORE_FILE}" >> $GITHUB_ENV
          echo "KS_PASS=${KS_PASS}" >> $GITHUB_ENV
          echo "K_ALIAS=${K_ALIAS}" >> $GITHUB_ENV
          echo "K_PASS=${K_PASS}" >> $GITHUB_ENV

      - name: 6. Build Capacitor Android Bridge, Play Store API 36 Config & Strict Source-Set Isolation
        env:
          NODE_OPTIONS: "--tls-min-v1.2 --dns-result-order=ipv4first"
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --no-audit --no-fund || (sleep 5 && npm install --no-audit --no-fund)
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

          # 6A. Enforce Google Play Console Target API 36 in variables.gradle
          VARS_GRADLE="android/variables.gradle"
          if [ -f "$VARS_GRADLE" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' "$VARS_GRADLE"
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' "$VARS_GRADLE"
            echo "✅ Enforced compileSdkVersion=36 and targetSdkVersion=36 in variables.gradle"
          fi

          # 6B. Compute Monotonic VERSION_CODE (20000 + RUN_NUMBER) & Configure Single-App-ID Release Build
          VERSION_CODE=$((20000 + RUN_NUMBER))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/g" "$APP_GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" "$APP_GRADLE"

            if ! grep -q "SUNNAH24_UNIFIED_RELEASE_CONFIG" "$APP_GRADLE"; then
              cat << 'GRADLE_EOF' >> "$APP_GRADLE"

          // --- SUNNAH24_UNIFIED_RELEASE_CONFIG ---
          android {
              compileSdk 36
              defaultConfig {
                  applicationId "com.mkrweb.sunnah24"
                  targetSdk 36
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "20001")
                  versionName System.getenv("VERSION_NAME") ?: "4.3.1"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE") ?: "${rootProject.projectDir}/../signing/sunnah24-release.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("K_ALIAS")
                      keyPassword System.getenv("K_PASS")
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }
              buildTypes {
                  release {
                      debuggable false
                      jniDebuggable false
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      ndk {
                          debugSymbolLevel 'FULL'
                      }
                  }
              }
          }
          GRADLE_EOF
              sed -i 's/^          //' "$APP_GRADLE"
            fi
            echo "✅ Configured Single-App-ID Release Build (versionCode=${VERSION_CODE}, versionName=${VERSION_NAME})"
          fi

          # 6C. Keep Rules for WebView JavascriptInterface & Capacitor Plugins
          PROGUARD_FILE="android/app/proguard-rules.pro"
          if ! grep -q "com.mkrweb.sunnah24" "$PROGUARD_FILE" 2>/dev/null; then
            cat << 'PROGUARD_EOF' >> "$PROGUARD_FILE"
          -keepattributes JavascriptInterface
          -keepattributes *Annotation*
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.mkrweb.sunnah24.** { *; }
          -keep class com.getcapacitor.** { *; }
          PROGUARD_EOF
            sed -i 's/^          //' "$PROGUARD_FILE"
          fi

          # 6D. Convert www/icon.svg into All Android Launcher Icons & Splash Screens
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          RES_DIR="android/app/src/main/res"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for folder in "${!SIZES[@]}"; do
            size=${SIZES[$folder]}
            mkdir -p "$RES_DIR/$folder"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_round.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_foreground.png"
          done

          rsvg-convert -w 512 -h 512 www/icon.svg -o /tmp/s24_logo_512.png
          convert -size 1080x1920 xc:"#F1F6F3" /tmp/s24_logo_512.png -gravity center -composite /tmp/s24_splash_screen.png
          for existing_splash in $(find "$RES_DIR" -name "splash.png"); do
            cp -f /tmp/s24_splash_screen.png "$existing_splash"
          done

          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_foreground.xml"
          rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          echo "✅ Custom Sunnah 24 Launcher Icons & Splash Screens generated!"

          # 6E. Clean Manifest & Remove Any Legacy Debug/Sideload Split Source Sets
          rm -rf "android/app/src/debug" "android/app/src/sideload"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "xmlns:tools" "$MANIFEST_FILE"; then
              sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android"|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST_FILE"
            fi
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST_FILE" || true
            sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST_FILE" || true
            sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST_FILE" || true
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove" />
    <uses-permission android:name="android.permission.AD_ID" tools:node="remove" />' "$MANIFEST_FILE"
          fi

          # 6G. Inject FileProvider XML for Scoped Storage
          XML_DIR="android/app/src/main/res/xml"
          mkdir -p "$XML_DIR"
          cat << 'EOF' > "$XML_DIR/file_paths.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="external_files_path" path="." />
              <external-files-path name="apk_updates_dir" path="Download/" />
              <external-cache-path name="external_cache_path" path="." />
              <cache-path name="cache_path" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF
          sed -i 's/^          //' "$XML_DIR/file_paths.xml"

          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "fileprovider" "$MANIFEST_FILE"; then
              sed -i '/<\/application>/i               <provider                  android:name="androidx.core.content.FileProvider"                  android:authorities="${applicationId}.fileprovider"                  android:exported="false"                  android:grantUriPermissions="true">                  <meta-data                      android:name="android.support.FILE_PROVIDER_PATHS"                      android:resource="@xml/file_paths" />              </provider>' "$MANIFEST_FILE"
            fi
          fi

          # 6H. Unified Play-Store & Sideload Safe MainActivity in src/main/java/com/mkrweb/sunnah24/MainActivity.java
          rm -rf android/app/src/main/java/com/mkrweb/sunnah24 android/app/src/release/java/com/mkrweb/sunnah24
          MAIN_JAVA_DIR="android/app/src/main/java/com/mkrweb/sunnah24"
          mkdir -p "$MAIN_JAVA_DIR"
          cat << 'MAIN_JAVA_EOF' > "$MAIN_JAVA_DIR/MainActivity.java"
          package com.mkrweb.sunnah24;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      webView.setBackgroundColor(Color.parseColor("#F1F6F3"));
                      WebSettings ws = webView.getSettings();
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      ws.setCacheMode(WebSettings.LOAD_DEFAULT);
                      webView.addJavascriptInterface(new SunnahVaultBridge(), "AndroidDownloader");
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "(window.handleSunnahBackNavigation ? window.handleSunnahBackNavigation() : false)",
                                  result -> {
                                      if ("false".equals(result)) {
                                          finish();
                                      }
                                  }
                              );
                          } else {
                              finish();
                          }
                      }
                  });
              }

              public class SunnahVaultBridge {
                  @JavascriptInterface
                  public boolean isSelfUpdateSupported() {
                      return false;
                  }

                  @JavascriptInterface
                  public boolean canRequestPackageInstalls() {
                      return false;
                  }

                  @JavascriptInterface
                  public String getInstalledVersionName() {
                      try {
                          PackageInfo pInfo = getPackageManager().getPackageInfo(getPackageName(), 0);
                          return pInfo.versionName;
                      } catch (Exception e) {
                          return "4.3.1";
                      }
                  }

                  @JavascriptInterface
                  public boolean autoSaveInternalVault(String jsonPayload) {
                      try {
                          File vaultFile = new File(getFilesDir(), "sunnah24_enterprise_vault.json");
                          try (FileOutputStream fos = new FileOutputStream(vaultFile, false)) {
                              fos.write(jsonPayload.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String autoLoadInternalVault() {
                      try {
                          File vaultFile = new File(getFilesDir(), "sunnah24_enterprise_vault.json");
                          if (!vaultFile.exists()) return "";
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(new FileInputStream(vaultFile), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line);
                              }
                          }
                          return sb.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String saveJsonToDownloads(String fileName, String jsonContent) {
                      try {
                          String safeFileName = fileName.replaceAll("[^a-zA-Z0-9._-]", "_");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, safeFileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                                          os.flush();
                                      }
                                  }
                                  return "Downloads/" + safeFileName;
                              }
                          }
                          File appDownloadDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (appDownloadDir == null) appDownloadDir = getFilesDir();
                          if (!appDownloadDir.exists()) appDownloadDir.mkdirs();
                          File outFile = new File(appDownloadDir, safeFileName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return outFile.getAbsolutePath();
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }
              }
          }
          MAIN_JAVA_EOF
          sed -i 's/^          //' "$MAIN_JAVA_DIR/MainActivity.java"
          echo "✅ Wrote clean unified MainActivity.java"

          # 6I. Inject Google Maven Central Mirror Init Script & Gradle HTTP Retry Properties
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'INIT_GRADLE_EOF' > "$HOME/.gradle/init.d/00-google-maven-mirror.init.gradle"
          def GOOGLE_MAVEN_CENTRAL = "https://maven-central.storage-download.googleapis.com/maven2/"
          def MAVEN_CENTRAL_PRIMARY = "https://repo1.maven.org/maven2/"

          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url GOOGLE_MAVEN_CENTRAL }
                  google()
                  maven { url MAVEN_CENTRAL_PRIMARY }
                  gradlePluginPortal()
              }
              try {
                  settings.dependencyResolutionManagement.repositories {
                      maven { url GOOGLE_MAVEN_CENTRAL }
                      google()
                      maven { url MAVEN_CENTRAL_PRIMARY }
                  }
              } catch (Throwable ignored) {}
          }

          allprojects {
              buildscript {
                  repositories {
                      maven { url GOOGLE_MAVEN_CENTRAL }
                      google()
                      maven { url MAVEN_CENTRAL_PRIMARY }
                      mavenCentral()
                  }
              }
              repositories {
                  maven { url GOOGLE_MAVEN_CENTRAL }
                  google()
                  maven { url MAVEN_CENTRAL_PRIMARY }
                  mavenCentral()
              }
          }
          INIT_GRADLE_EOF
          sed -i 's/^          //' "$HOME/.gradle/init.d/00-google-maven-mirror.init.gradle"
          cp -f "$HOME/.gradle/init.d/00-google-maven-mirror.init.gradle" "android/maven-mirror.init.gradle"

          GRADLE_PROPS="android/gradle.properties"
          touch "$GRADLE_PROPS"
          if ! grep -q "org.gradle.internal.repository.max.tentatives" "$GRADLE_PROPS"; then
            cat << 'PROPS_EOF' >> "$GRADLE_PROPS"

          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          org.gradle.internal.repository.max.tentatives=6
          org.gradle.internal.repository.initial.backoff=3000
          systemProp.http.keepAlive=true
          systemProp.sun.net.client.defaultConnectTimeout=120000
          systemProp.sun.net.client.defaultReadTimeout=120000
          PROPS_EOF
            sed -i 's/^          //' "$GRADLE_PROPS"
          fi
          echo "✅ Configured Google Maven Central Mirror & HTTP 429 Auto-Retry in Gradle!"

      - name: 7. Compile Signed Release APK (assembleRelease) & Play Store Signed AAB (bundleRelease)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease             --init-script maven-mirror.init.gradle             --no-daemon             -Dorg.gradle.internal.http.connectionTimeout=120000             -Dorg.gradle.internal.http.socketTimeout=120000             -Dorg.gradle.internal.repository.max.tentatives=6             -Dorg.gradle.internal.repository.initial.backoff=3000 ||           (echo "⏳ Transient network/Maven hiccup detected; waiting 12s and retrying with cached artifacts..." &&            sleep 12 &&            ./gradlew assembleRelease bundleRelease              --init-script maven-mirror.init.gradle              --no-daemon              --max-workers=2              -Dorg.gradle.internal.repository.max.tentatives=8              -Dorg.gradle.internal.repository.initial.backoff=5000)

      - name: 7B. Android 16 (API 36) Emulator Boot & Launch Smoke Test
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.mkrweb.sunnah24/.MainActivity
            sleep 3
            adb shell pidof com.mkrweb.sunnah24

      - name: 8. Verify & Seal Release APK & Play Store Signed AAB
        run: |
          BUILT_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ] || [ ! -f "$BUILT_APK" ]; then
            echo "❌ ERROR: Signed Release APK was not generated!"
            ls -laR android/app/build/outputs/apk || true
            exit 1
          fi
          SIGNED_APK="Sunnah-24-v4.3-Enterprise-Signed.apk"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          if $BUILD_TOOLS_DIR/apksigner verify "$BUILT_APK" >/dev/null 2>&1; then
            cp -f "$BUILT_APK" "$SIGNED_APK"
          else
            $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$BUILT_APK" app-release-aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign               --ks "$KEYSTORE_FILE"               --ks-key-alias "$K_ALIAS"               --ks-pass "pass:$KS_PASS"               --key-pass "pass:$K_PASS"               --v1-signing-enabled true               --v2-signing-enabled true               --v3-signing-enabled true               --out "$SIGNED_APK"               app-release-aligned.apk
          fi

          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK"
          $BUILD_TOOLS_DIR/aapt2 dump badging "$SIGNED_APK" | head -n 5 || true

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" ./Sunnah-24-v4.3-PlayStore-Signed.aab
            if ! jarsigner -verify -certs ./Sunnah-24-v4.3-PlayStore-Signed.aab >/dev/null 2>&1; then
              echo "🔐 Signing Play Store AAB with release keystore..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256                 -keystore "$KEYSTORE_FILE"                 -storepass "$KS_PASS"                 -keypass "$K_PASS"                 ./Sunnah-24-v4.3-PlayStore-Signed.aab "$K_ALIAS"
            fi
            jarsigner -verify -verbose -certs ./Sunnah-24-v4.3-PlayStore-Signed.aab
            echo "✅ Play Store Signed AAB verified: Sunnah-24-v4.3-PlayStore-Signed.aab"
          else
            echo "❌ ERROR: Play Store AAB was not generated!"
            exit 1
          fi

      - name: 9. Upload Signed APK & Play Store AAB as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Enterprise-Release-Bundle
          path: |
            Sunnah-24-v4.3-Enterprise-Signed.apk
            Sunnah-24-v4.3-PlayStore-Signed.aab

      - name: 10. Publish Atomic GitHub Release with APK & Play Store AAB (Fault-Tolerant 403-Safe)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GH_PAT || github.token }}
          MULTI_REPO_PAT: ${{ secrets.MULTI_REPO_PAT || secrets.RELEASE_PAT || secrets.GH_PAT || '' }}
          TARGET_REPOSITORIES_VARS: ${{ vars.TARGET_REPOSITORIES || secrets.TARGET_REPOSITORIES || '' }}
          TARGET_REPOSITORIES_INPUT: ${{ github.event.inputs.target_repositories || '' }}
        run: |
          TAG="v${VERSION_NAME}"
          TITLE="☪️ Sunnah 24 v${VERSION_NAME} — Play Store Ready AAB & Signed Enterprise APK"
          cat << 'EOF' > /tmp/release_notes.md
          ### ☪️ সুন্নাহ ২৪ (Sunnah 24) — Play Store Ready `.aab` & Signed Android `.apk` (v${VERSION_NAME})
          - **Google Play Store Ready `.aab` (`Sunnah-24-v4.3-PlayStore-Signed.aab`):** Compiled with `targetSdk 36` / `compileSdk 36`, R8 code shrinking + deobfuscation mapping, zero self-updater bytecode, and zero legacy storage permissions.
          - **Sideload Auto-Updating `.apk` (`Sunnah-24-v4.3-Enterprise-Signed.apk`):** Full in-app update support via Android's system DownloadManager for direct website users.
          - **Triple-Redundant Auto-Vault:** Preserves all user habit records across LocalStorage, IndexedDB, and Native Android Vault.
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          sed -i "s/\${VERSION_NAME}/${VERSION_NAME}/g" /tmp/release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sunnah-24-v4.3-Enterprise-Signed.apk Sunnah-24-v4.3-PlayStore-Signed.aab --clobber || true
            echo "✅ Updated existing GitHub Release $TAG"
          else
            if gh release create "$TAG" Sunnah-24-v4.3-Enterprise-Signed.apk Sunnah-24-v4.3-PlayStore-Signed.aab --title "$TITLE" --notes-file /tmp/release_notes.md --target "${GITHUB_SHA}"; then
              echo "✅ Published GitHub Release $TAG successfully!"
            else
              echo "ℹ️ Notice: Default GITHUB_TOKEN has read-only Release permissions (403). Your Signed APK & Play Store AAB are already safely uploaded in Step 9 Build Artifacts (Sunnah-24-Enterprise-Release-Bundle)!"
              echo "💡 To also enable automatic public Releases page publishing, go to Repo Settings -> Actions -> General -> Workflow permissions -> select 'Read and write permissions' and click Save."
            fi
          fi

          # Gradual Multi-Repository Release Distribution (if mirror repositories are configured)
          SYNC_PAT="${MULTI_REPO_PAT:-$GH_TOKEN}"
          RAW_REPOS="${TARGET_REPOSITORIES_INPUT} ${TARGET_REPOSITORIES_VARS}"
          if [ -f "sync-repos.txt" ]; then
            FILE_REPOS=$(grep -v '^[[:space:]]*#' sync-repos.txt | tr '\n' ' ')
            RAW_REPOS="${RAW_REPOS} ${FILE_REPOS}"
          fi
          CLEAN_REPOS=$(echo "$RAW_REPOS" | tr ',' ' ' | xargs)
          if [ -n "$CLEAN_REPOS" ] && [ -n "$SYNC_PAT" ]; then
            for TARGET_REPO in $CLEAN_REPOS; do
              if [ "$TARGET_REPO" = "${GITHUB_REPOSITORY}" ]; then
                continue
              fi
              echo "📦 Gradually publishing APK + AAB release $TAG to mirror repository: $TARGET_REPO ..."
              if GH_TOKEN="$SYNC_PAT" gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
                GH_TOKEN="$SYNC_PAT" gh release upload "$TAG" Sunnah-24-v4.3-Enterprise-Signed.apk Sunnah-24-v4.3-PlayStore-Signed.aab --repo "$TARGET_REPO" --clobber || true
              else
                GH_TOKEN="$SYNC_PAT" gh release create "$TAG" Sunnah-24-v4.3-Enterprise-Signed.apk Sunnah-24-v4.3-PlayStore-Signed.aab --repo "$TARGET_REPO" --title "$TITLE" --notes-file /tmp/release_notes.md || true
              fi
              sleep 4
            done
          fi
