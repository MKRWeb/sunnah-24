name: Sunnah 24 — Enterprise CI/CD, GitHub Pages & Signed APK Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Root Web Files into www Directory
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-apk:
    name: Build, Verify & Release Sunnah 24 Signed APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 & Java 17 (Android Gradle Toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Sync & Verify Web Assets
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js
          test -f www/manifest.json
          test -f www/sw.js
          test -f www/icon.svg
          test -f www/privacy.html
          node --check www/app.js
          node --check www/sw.js
          echo "✅ All Sunnah 24 assets and JS syntax verified!"

      - name: 4. Build Capacitor Android Bridge, Custom APK Icons & Native Installer Bridge
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # 4B. Convert www/icon.svg into All Android APK Mipmap Launcher Icons
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          RES_DIR="android/app/src/main/res"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for folder in "${!SIZES[@]}"; do
            size=${SIZES[$folder]}
            mkdir -p "$RES_DIR/$folder"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_round.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_foreground.png"
          done

          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_foreground.xml"
          rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          echo "✅ Custom Sunnah 24 APK Launcher Icons generated!"

          # 4C. Enable Android Auto-Backup in AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST_FILE" || true
          fi

          # 4D. Inject FileProvider XML and Manifest Provider Declaration
          XML_DIR="android/app/src/main/res/xml"
          mkdir -p "$XML_DIR"
          cat << 'EOF' > "$XML_DIR/file_paths.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-cache-path name="external_cache_path" path="." />
              <cache-path name="cache_path" path="." />
              <external-files-path name="external_files_path" path="." />
          </paths>
          EOF

          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "fileprovider" "$MANIFEST_FILE"; then
              sed -i '/<\/application>/i \
              <provider\
                  android:name="androidx.core.content.FileProvider"\
                  android:authorities="${applicationId}.fileprovider"\
                  android:exported="false"\
                  android:grantUriPermissions="true">\
                  <meta-data\
                      android:name="android.support.FILE_PROVIDER_PATHS"\
                      android:resource="@xml/file_paths" />\
              </provider>' "$MANIFEST_FILE"
            fi
          fi

          # 4E. Inject OS DownloadManager Auto-Installer bridge into MainActivity.java
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.mkrweb.sunnah24;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;

          public class MainActivity extends BridgeActivity {
              private long downloadId = -1;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings ws = this.bridge.getWebView().getSettings();
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      this.bridge.getWebView().addJavascriptInterface(new WebAppDownloader(), "AndroidDownloader");
                  }

                  BroadcastReceiver onComplete = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                          if (downloadId == id) {
                              DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              DownloadManager.Query query = new DownloadManager.Query();
                              query.setFilterById(downloadId);
                              Cursor cursor = dm.query(query);
                              if (cursor.moveToFirst()) {
                                  int statusIndex = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                                  if (statusIndex >= 0 && cursor.getInt(statusIndex) == DownloadManager.STATUS_SUCCESSFUL) {
                                      int uriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI);
                                      if (uriIndex >= 0) {
                                          String uriString = cursor.getString(uriIndex);
                                          installApk(Uri.parse(uriString));
                                      }
                                  }
                              }
                              cursor.close();
                          }
                      }
                  };

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(onComplete, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED);
                  } else {
                      registerReceiver(onComplete, new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE));
                  }
              }

              private void installApk(Uri uri) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      Uri apkUri;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          File file = new File(uri.getPath());
                          apkUri = androidx.core.content.FileProvider.getUriForFile(
                              MainActivity.this,
                              getPackageName() + ".fileprovider",
                              file
                          );
                          intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } else {
                          intent.setDataAndType(uri, "application/vnd.android.package-archive");
                      }
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(MainActivity.this, "Auto-Install Error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              public class WebAppDownloader {
                  @JavascriptInterface
                  public void downloadAndInstallApk(String urlString) {
                      try {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "⬇️ Downloading update in background...", Toast.LENGTH_SHORT).show());
                          
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(urlString));
                          request.setTitle("Sunnah 24 Update");
                          request.setDescription("Downloading latest version...");
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalFilesDir(MainActivity.this, Environment.DIRECTORY_DOWNLOADS, "Sunnah24-Update.apk");

                          File oldFile = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "Sunnah24-Update.apk");
                          if (oldFile.exists()) oldFile.delete();

                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          downloadId = dm.enqueue(request);
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download Error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }
          }
          EOF
            echo "✅ Injected OS DownloadManager Auto-Installer bridge into $MAIN_ACT"
          fi

      - name: 5. Compile Release & Debug APKs + Play Store Bundle via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: 6. Sign Release APK & AAB for Direct Installation
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > sunnah24-release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            KS_PASS="sunnah24pass"
            K_ALIAS="sunnah24"
            K_PASS="sunnah24pass"
            keytool -genkey -v -keystore sunnah24-release.keystore \
              -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=MKRWeb, OU=Sunnah24, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"
          fi

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="Sunnah-24-v3.8-Enterprise-Signed.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks sunnah24-release.keystore \
            --ks-key-alias "$K_ALIAS" --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" --out "$SIGNED_APK" app-release-aligned.apk

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore sunnah24-release.keystore -storepass "$KS_PASS" -keypass "$K_PASS" \
              "$AAB_PATH" "$K_ALIAS"
            cp "$AAB_PATH" ./Sunnah-24-v3.8-PlayStore-Signed.aab
          fi
          echo "✅ Signed APK ready: $SIGNED_APK"

      - name: 7. Upload Signed APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Enterprise-APK
          path: |
            Sunnah-24-v3.8-Enterprise-Signed.apk
            Sunnah-24-v3.8-PlayStore-Signed.aab

      - name: 8. Publish Automatic GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.8.${{ github.run_number }}
          name: "☪️ Sunnah 24 v3.8.${{ github.run_number }} — OS DownloadManager Auto-Installer APK"
          body: |
            ### ☪️ সুন্নাহ ২৪ (Sunnah 24) — Enterprise Signed Android APK Release (v3.8)
            - **OS DownloadManager Auto-Installer:** Background downloading with automatic package installer trigger upon completion.
            - **180-Day Triple-Redundant Auto-Vault:** LocalStorage + IndexedDB + Native Android Vault.
          files: |
            Sunnah-24-v3.8-Enterprise-Signed.apk
            Sunnah-24-v3.8-PlayStore-Signed.aab
