name: Sunnah 24 — Streamlined CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'signing/**'
  pull_request:
    branches: [ main, master ]
  repository_dispatch:
    types: [ sunnah24-auto-sync, multi-repo-update ]
  workflow_dispatch:
    inputs:
      target_repositories:
        description: "Comma-separated list of additional repositories (owner/repo) to deploy simultaneously"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "sunnah24-pipeline-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-pages-multi:
    name: 1. Deploy on Pages (Multiple Repositories at Once)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      repo_list: ${{ steps.matrix.outputs.repo_list }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Prepare Web Bundle & Cache-Busting
        run: |
          LATEST_SHA=$(git rev-parse --short=7 HEAD)
          mkdir -p www
          
          # Sync core web assets
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" "www/$f"
            elif [ -f "www/$f" ]; then
              cp -f "www/$f" "$f"
            fi
          done

          # Sync extra folders if present
          for subdir in assets icons audio fonts data components locales modules scripts styles; do
            if [ -d "$subdir" ]; then
              mkdir -p "www/$subdir"
              cp -rf "$subdir/." "www/$subdir/"
            elif [ -d "www/$subdir" ]; then
              mkdir -p "$subdir"
              cp -rf "www/$subdir/." "$subdir/"
            fi
          done

          CACHE_VER="v4.2.${GITHUB_RUN_NUMBER}-${LATEST_SHA}"
          if [ -f "www/sw.js" ]; then
            sed -i "s/sunnah-24-cache-[a-zA-Z0-9._-]*/sunnah-24-cache-${CACHE_VER}/g" www/sw.js || true
          fi
          if [ -f "www/index.html" ]; then
            sed -i "s|href=\"style.css[^\"]*\"|href=\"style.css?v=${CACHE_VER}\"|g" www/index.html || true
            sed -i "s|src=\"app.js[^\"]*\"|src=\"app.js?v=${CACHE_VER}\"|g" www/index.html || true
          fi

          cat << EOF > www/version.json
          {
            "tag_name": "v4.2.${GITHUB_RUN_NUMBER}",
            "version": "4.2.${GITHUB_RUN_NUMBER}",
            "commit": "${LATEST_SHA}",
            "apk_url": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Sunnah-24-v4.2-Enterprise-Signed.apk"
          }
          EOF

      - name: 4. Deploy to Primary GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './www'
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 5. Build Multi-Repository Matrix
        id: matrix
        run: |
          RAW_REPOS="${{ github.event.inputs.target_repositories || secrets.MULTI_REPO_TARGETS || vars.MULTI_REPO_TARGETS || '' }}"
          CLEAN=$(echo "$RAW_REPOS" | tr ',' ' ' | xargs)
          JSON="["
          FIRST=1
          for r in $CLEAN; do
            if [ -n "$r" ] && [ "$r" != "$GITHUB_REPOSITORY" ]; then
              if [ "$FIRST" -eq 0 ]; then JSON="${JSON},"; fi
              JSON="${JSON}\"${r}\""
              FIRST=0
            fi
          done
          JSON="${JSON}]"

          if [ "$JSON" = "[]" ]; then
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
            echo 'repo_list=["none"]' >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
            echo "repo_list=${JSON}" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist www Bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-www-bundle
          path: ./www

  deploy-pages-additional-repos:
    name: "1B. Deploy on Pages (Target: ${{ matrix.target_repo }})"
    needs: [ deploy-pages-multi ]
    if: github.event_name != 'pull_request' && needs.deploy-pages-multi.outputs.has_matrix == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target_repo: ${{ fromJson(needs.deploy-pages-multi.outputs.repo_list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download www Bundle
        uses: actions/download-artifact@v4
        with:
          name: verified-www-bundle
          path: ./www
      - name: Push Codebase & Deploy Pages to ${{ matrix.target_repo }}
        env:
          SYNC_PAT: ${{ secrets.MULTI_REPO_PAT || secrets.RELEASE_PAT || secrets.GH_PAT || github.token }}
        run: |
          set -e
          WORK_DIR="/tmp/sync_repo"
          GH_DIR="/tmp/sync_gh"
          rm -rf "$WORK_DIR" "$GH_DIR"

          git clone --depth 1 "https://x-access-token:${SYNC_PAT}@github.com/${{ matrix.target_repo }}.git" "$WORK_DIR"
          cd "$WORK_DIR"
          DEFAULT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          mkdir -p www

          for asset in index.html style.css app.js sw.js manifest.json icon.svg privacy.html version.json; do
            if [ -f "${{ github.workspace }}/www/$asset" ]; then
              cp -f "${{ github.workspace }}/www/$asset" "./$asset"
              cp -f "${{ github.workspace }}/www/$asset" "./www/$asset"
            fi
          done

          sed -i "s|github.com/${GITHUB_REPOSITORY}/releases|github.com/${{ matrix.target_repo }}/releases|g" ./index.html ./www/index.html ./app.js ./www/app.js ./version.json ./www/version.json || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(sync): update codebase from ${GITHUB_REPOSITORY} [skip ci]"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

          mkdir -p "$GH_DIR"
          cd "$GH_DIR"
          git init
          git checkout -b gh-pages
          cp -rf "${WORK_DIR}/www/." ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy(pages): live update"
          git remote add origin "https://x-access-token:${SYNC_PAT}@github.com/${{ matrix.target_repo }}.git"
          git push --force origin gh-pages:gh-pages

          gh api --method POST "repos/${{ matrix.target_repo }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 || \
          gh api --method PUT "repos/${{ matrix.target_repo }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" -f "build_type=legacy" >/dev/null 2>&1 || true
          gh api --method POST "repos/${{ matrix.target_repo }}/pages/builds" >/dev/null 2>&1 || true

  build-and-release:
    name: 2. Release APK Version & Play Store Ready AAB File
    needs: [ deploy-pages-multi ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RUN_NUMBER: ${{ github.run_number }}
      VERSION_NAME: "4.2.${{ github.run_number }}"
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 2. Setup Node.js 22 & Java 21
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Download www Bundle
        uses: actions/download-artifact@v4
        with:
          name: verified-www-bundle
          path: ./www

      - name: 4. Copy Web Assets
        run: |
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "www/$f" ]; then cp -f "www/$f" "$f"; fi
          done

      - name: 5. Setup Keystore
        run: |
          mkdir -p signing
          KEYSTORE_FILE="$PWD/signing/sunnah24-release.keystore"
          KS_PASS="sunnah24pass"
          K_ALIAS="sunnah24"
          K_PASS="sunnah24pass"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=MKRWeb, OU=Sunnah24, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"
          fi
          echo "KEYSTORE_FILE=${KEYSTORE_FILE}" >> $GITHUB_ENV
          echo "KS_PASS=${KS_PASS}" >> $GITHUB_ENV
          echo "K_ALIAS=${K_ALIAS}" >> $GITHUB_ENV
          echo "K_PASS=${K_PASS}" >> $GITHUB_ENV

      - name: 6. Build Android APK & AAB
        env:
          NODE_OPTIONS: "--tls-min-v1.2"
        run: |
          npm install --no-audit --no-fund
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap copy android
          npx cap sync android

          # Enforce API 35
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          fi

          VERSION_CODE=$((2100 + RUN_NUMBER))
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/g" "$APP_GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" "$APP_GRADLE"
            
            if ! grep -q "GOOGLE PLAY STORE PRODUCTION AAB CONFIGURATION" "$APP_GRADLE"; then
              cat << 'GRADLE_EOF' >> "$APP_GRADLE"
          android {
              compileSdk 35
              defaultConfig { targetSdk 35 }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE") ?: "${rootProject.projectDir}/../signing/sunnah24-release.keystore")
                      storePassword System.getenv("KS_PASS") ?: "sunnah24pass"
                      keyAlias System.getenv("K_ALIAS") ?: "sunnah24"
                      keyPassword System.getenv("K_PASS") ?: "sunnah24pass"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          GRADLE_EOF
            fi
          fi

          # Generate Icons
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          RES_DIR="android/app/src/main/res"
          for size in 48 72 96 144 192; do
            case $size in
              48) d="mipmap-mdpi";;
              72) d="mipmap-hdpi";;
              96) d="mipmap-xhdpi";;
              144) d="mipmap-xxhdpi";;
              192) d="mipmap-xxxhdpi";;
            esac
            mkdir -p "$RES_DIR/$d"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$d/ic_launcher.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$d/ic_launcher_round.png"
          done

          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon
          cd ..

          # Sign APK
          UNSIGNED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="Sunnah-24-v4.2-Enterprise-Signed.apk"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out "$SIGNED_APK" \
            app-release-aligned.apk

          # Copy AAB
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" ./Sunnah-24-v4.2-PlayStore-Signed.aab
          fi

      - name: 7. Publish GitHub Release (Signed APK & Play Store AAB)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GH_PAT || github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          TITLE="☪️ Sunnah 24 v${VERSION_NAME} — Play Store Ready AAB & Signed Enterprise APK"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sunnah-24-v4.2-Enterprise-Signed.apk Sunnah-24-v4.2-PlayStore-Signed.aab --clobber || true
          else
            gh release create "$TAG" Sunnah-24-v4.2-Enterprise-Signed.apk Sunnah-24-v4.2-PlayStore-Signed.aab --title "$TITLE" --notes "Automated release v${VERSION_NAME}" || true
          fi

