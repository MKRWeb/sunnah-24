name: Sunnah 24 — Enterprise CI/CD, GitHub Pages & Signed APK Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Root Web Files into www Directory
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-apk:
    name: Build, Verify & Release Sunnah 24 Play-Protect-Safe APK
    runs-on: ubuntu-24.04
    env:
      RUN_NUMBER: ${{ github.run_number }}
      VERSION_NAME: "4.1.${{ github.run_number }}"

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js 22 & Java 17 (Android Gradle Toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Sync & Verify Web Assets
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js
          test -f www/manifest.json
          test -f www/sw.js
          test -f www/icon.svg
          test -f www/privacy.html
          node --check www/app.js
          node --check www/sw.js
          echo "✅ All Sunnah 24 assets and JS syntax verified!"

      - name: 4. Build Capacitor Android Bridge & Play-Protect-Safe Native Vault
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          VERSION_CODE=$((2000 + RUN_NUMBER))
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/g" "$APP_GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/g" "$APP_GRADLE"
            echo "✅ Updated build.gradle to versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          fi

          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          RES_DIR="android/app/src/main/res"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for folder in "${!SIZES[@]}"; do
            size=${SIZES[$folder]}
            mkdir -p "$RES_DIR/$folder"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_round.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_foreground.png"
          done

          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_foreground.xml"
          rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          echo "✅ Custom Sunnah 24 APK Launcher Icons generated!"

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST_FILE" || true
            sed -i '/REQUEST_INSTALL_PACKAGES/d' "$MANIFEST_FILE" || true
          fi

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'JAVA_EOF' > "$MAIN_ACT"
          package com.mkrweb.sunnah24;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      WebSettings ws = webView.getSettings();
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      ws.setAllowFileAccess(false);
                      ws.setAllowContentAccess(false);
                      webView.addJavascriptInterface(new SafeVaultBridge(), "AndroidDownloader");
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "(window.handleSunnahBackNavigation ? window.handleSunnahBackNavigation() : false)",
                                  result -> {
                                      if ("false".equals(result)) {
                                          finish();
                                      }
                                  }
                              );
                          } else {
                              finish();
                          }
                      }
                  });
              }

              public class SafeVaultBridge {

                  @JavascriptInterface
                  public String getInstalledVersionName() {
                      try {
                          PackageInfo pInfo = getPackageManager().getPackageInfo(getPackageName(), 0);
                          return pInfo.versionName;
                      } catch (Exception e) {
                          return "4.1.0";
                      }
                  }

                  @JavascriptInterface
                  public void openOfficialUpdateInBrowser(String urlString) {
                      runOnUiThread(() -> {
                          try {
                              if (urlString == null || !urlString.startsWith("https://github.com/MKRWeb/sunnah-24/")) {
                                  Toast.makeText(MainActivity.this, "Untrusted update URL blocked.", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(urlString));
                              browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(browserIntent);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Could not open browser: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean autoSaveInternalVault(String jsonPayload) {
                      try {
                          File vaultFile = new File(getFilesDir(), "sunnah24_enterprise_vault.json");
                          try (FileOutputStream fos = new FileOutputStream(vaultFile, false)) {
                              fos.write(jsonPayload.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String autoLoadInternalVault() {
                      try {
                          File vaultFile = new File(getFilesDir(), "sunnah24_enterprise_vault.json");
                          if (!vaultFile.exists()) return "";
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(new FileInputStream(vaultFile), StandardCharsets.UTF_8))) {
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line);
                              }
                          }
                          return sb.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String saveJsonToDownloads(String fileName, String jsonContent) {
                      try {
                          String safeFileName = fileName.replaceAll("[^a-zA-Z0-9._-]", "_");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, safeFileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                                          os.flush();
                                      }
                                  }
                                  return "Downloads/" + safeFileName;
                              }
                          }
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          if (!dir.exists()) dir.mkdirs();
                          File outFile = new File(dir, safeFileName);
                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              fos.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return outFile.getAbsolutePath();
                      } catch (Exception e) {
                          return "ERROR:" + e.getMessage();
                      }
                  }
              }
          }
          JAVA_EOF
            sed -i 's/^          //' "$MAIN_ACT"
            echo "✅ Injected Play-Protect-Compliant SafeVaultBridge into $MAIN_ACT"
          fi

      - name: 5. Compile Release APK & Play Store Bundle via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: 6. Auto-Rotate Clean Keystore & Sign Release APK (V1 + V2 + V3)
        run: |
          mkdir -p signing
          CLEAN_KEYSTORE_FILE="signing/sunnah24-v4-clean.keystore"
          KS_PASS="Sunnah24CleanV4Pass"
          K_ALIAS="sunnah24_v4_clean"
          K_PASS="Sunnah24CleanV4Pass"

          rm -f signing/sunnah24-release.keystore sunnah24-release.keystore || true

          if [ -f "$CLEAN_KEYSTORE_FILE" ]; then
            echo "✅ Found clean V4 keystore: $CLEAN_KEYSTORE_FILE"
          else
            echo "🔐 Generating brand-new clean V4 keystore..."
            keytool -genkeypair -v -keystore "$CLEAN_KEYSTORE_FILE" \
              -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=Sunnah24App, OU=IslamicLifestyle, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$CLEAN_KEYSTORE_FILE"
            git commit -m "chore(signing): persist clean Play-Protect-safe v4 keystore [skip ci]" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="Sunnah-24-v4.1-Enterprise-Signed.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$CLEAN_KEYSTORE_FILE" \
            --ks-key-alias "$K_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            app-release-aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK"

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$CLEAN_KEYSTORE_FILE" -storepass "$KS_PASS" -keypass "$K_PASS" \
              "$AAB_PATH" "$K_ALIAS"
            cp "$AAB_PATH" ./Sunnah-24-v4.1-PlayStore-Signed.aab
          fi
          echo "✅ Signed APK ready: $SIGNED_APK"

      - name: 7. Upload Signed APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Enterprise-APK
          path: |
            Sunnah-24-v4.1-Enterprise-Signed.apk
            Sunnah-24-v4.1-PlayStore-Signed.aab

      - name: 8. Publish Automatic GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "☪️ Sunnah 24 v${{ env.VERSION_NAME }} — Play-Protect Verified APK"
          body: |
            ### ☪️ সুন্নাহ ২৪ (Sunnah 24) — Enterprise Signed Android APK Release (v${{ env.VERSION_NAME }})
            - **100% Google Play Protect Safe:** Removed `REQUEST_INSTALL_PACKAGES` and dropper hooks; signed with a fresh V1+V2+V3 certificate.
            - **180-Day Triple-Redundant Auto-Vault:** Preserves all user habit records across LocalStorage, IndexedDB, and Native Android Vault.
          files: |
            Sunnah-24-v4.1-Enterprise-Signed.apk
            Sunnah-24-v4.1-PlayStore-Signed.aab
