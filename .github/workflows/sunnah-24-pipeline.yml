name: Sunnah 24 — Enterprise CI/CD, GitHub Pages & Signed APK Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Root Web Files into www Directory
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web App Artifact (www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-apk:
    name: Build, Verify & Release Sunnah 24 Signed APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 & Java 17 (Android Gradle Toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Sync & Verify Web Assets
        run: |
          mkdir -p www
          for f in index.html style.css app.js sw.js manifest.json icon.svg privacy.html; do
            if [ -f "$f" ]; then
              cp -f "$f" www/
            fi
          done
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js
          test -f www/manifest.json
          test -f www/sw.js
          test -f www/icon.svg
          test -f www/privacy.html
          node --check www/app.js
          node --check www/sw.js
          echo "✅ All Sunnah 24 assets and JS syntax verified!"

      - name: 4. Build Capacitor Android Bridge, Custom APK Icons, Back-Button & Native Vault
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # 4B. Convert www/icon.svg into All Android APK Mipmap Launcher Icons
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          RES_DIR="android/app/src/main/res"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for folder in "${!SIZES[@]}"; do
            size=${SIZES[$folder]}
            mkdir -p "$RES_DIR/$folder"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_round.png"
            rsvg-convert -w $size -h $size www/icon.svg -o "$RES_DIR/$folder/ic_launcher_foreground.png"
          done

          rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
          rm -f "$RES_DIR/drawable/ic_launcher_foreground.xml"
          rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          echo "✅ Custom Sunnah 24 APK Launcher Icons generated!"

          # 4C. Enable Android Auto-Backup in AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/android:allowBackup="false"/android:allowBackup="true"/g' "$MANIFEST_FILE" || true
          fi

          # 4D. Inject Smart Back-Button + Native Multi-Month Vault + Downloads Bridge into MainActivity.java
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.mkrweb.sunnah24;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebSettings ws = this.bridge.getWebView().getSettings();
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      this.bridge.getWebView().addJavascriptInterface(new WebAppDownloader(), "AndroidDownloader");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().evaluateJavascript(
                          "(function() { return window.handleSunnahBackNavigation ? window.handleSunnahBackNavigation() : false; })();",
                          value -> {
                              if ("false".equals(value)) {
                                  runOnUiThread(() -> MainActivity.super.onBackPressed());
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              public class WebAppDownloader {
                  @JavascriptInterface
                  public boolean autoSaveInternalVault(String jsonContent) {
                      try {
                          File vaultFile = new File(getFilesDir(), "Sunnah24_AutoVault_v35.json");
                          try (FileOutputStream fos = new FileOutputStream(vaultFile)) {
                              fos.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public String autoLoadInternalVault() {
                      try {
                          File vaultFile = new File(getFilesDir(), "Sunnah24_AutoVault_v35.json");
                          if (!vaultFile.exists()) return "";
                          try (FileInputStream fis = new FileInputStream(vaultFile);
                               ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                              byte[] buffer = new byte[4096];
                              int read;
                              while ((read = fis.read(buffer)) != -1) {
                                  bos.write(buffer, 0, read);
                              }
                              return bos.toString("UTF-8");
                          }
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String saveJsonToDownloads(String filename, String jsonContent) {
                      try {
                          byte[] bytes = jsonContent.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Sunnah24");
                              ContentResolver resolver = getContentResolver();
                              Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                      }
                                  }
                                  runOnUiThread(() -> Toast.makeText(
                                      MainActivity.this,
                                      "✅ Saved: Downloads/Sunnah24/" + filename,
                                      Toast.LENGTH_LONG
                                  ).show());
                                  return "Downloads/Sunnah24/" + filename;
                              }
                          } else {
                              File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Sunnah24");
                              if (!dir.exists()) dir.mkdirs();
                              File file = new File(dir, filename);
                              try (FileOutputStream fos = new FileOutputStream(file)) {
                                  fos.write(bytes);
                                  fos.flush();
                              }
                              runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  "✅ Saved: Downloads/Sunnah24/" + filename,
                                  Toast.LENGTH_LONG
                              ).show());
                              return file.getAbsolutePath();
                          }
                      } catch (Exception e) {
                          try {
                              File fallbackDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                              if (fallbackDir != null && !fallbackDir.exists()) fallbackDir.mkdirs();
                              File fallbackFile = new File(fallbackDir, filename);
                              try (FileOutputStream fos = new FileOutputStream(fallbackFile)) {
                                  fos.write(jsonContent.getBytes(StandardCharsets.UTF_8));
                                  fos.flush();
                              }
                              return fallbackFile.getAbsolutePath();
                          } catch (Exception ex) {
                              return "ERROR:" + ex.getMessage();
                          }
                      }
                      return "ERROR:Unknown";
                  }
              }
          }
          EOF
            echo "✅ Injected Smart Back-Button + Native Multi-Month Vault into $MAIN_ACT"
          fi

      - name: 5. Compile Release & Debug APKs + Play Store Bundle via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: 6. Sign Release APK & AAB for Direct Installation
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > sunnah24-release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASSWORD"
          else
            KS_PASS="sunnah24pass"
            K_ALIAS="sunnah24"
            K_PASS="sunnah24pass"
            keytool -genkey -v -keystore sunnah24-release.keystore \
              -alias "$K_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=MKRWeb, OU=Sunnah24, O=MKRWeb, L=Rajshahi, S=Rajshahi, C=BD"
          fi

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="Sunnah-24-v3.6-Enterprise-Signed.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks sunnah24-release.keystore \
            --ks-key-alias "$K_ALIAS" --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" --out "$SIGNED_APK" app-release-aligned.apk

          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore sunnah24-release.keystore -storepass "$KS_PASS" -keypass "$K_PASS" \
              "$AAB_PATH" "$K_ALIAS"
            cp "$AAB_PATH" ./Sunnah-24-v3.6-PlayStore-Signed.aab
          fi
          echo "✅ Signed APK ready: $SIGNED_APK"

      - name: 7. Upload Signed APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunnah-24-Enterprise-APK
          path: |
            Sunnah-24-v3.6-Enterprise-Signed.apk
            Sunnah-24-v3.6-PlayStore-Signed.aab

      - name: 8. Publish Automatic GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.${{ github.run_number }}
          name: "☪️ Sunnah 24 v3.6.${{ github.run_number }} — Smart Back-Button & Compact History APK"
          body: |
            ### ☪️ সুন্নাহ ২৪ (Sunnah 24) — Enterprise Signed Android APK Release (v3.6)
            - **Smart Hardware Back-Button Navigation:** Closes open modals, clears filters, and steps back to previous tabs instead of exiting the app
            - **Compact Scrollable History Modal:** Inspecting any day in the 7-Day or 6-Month matrix renders inside a clean, mobile-fitted scrollable container
            - **180-Day Triple-Redundant Auto-Vault:** LocalStorage + IndexedDB + Native Android Vault
          files: |
            Sunnah-24-v3.6-Enterprise-Signed.apk
            Sunnah-24-v3.6-PlayStore-Signed.aab
